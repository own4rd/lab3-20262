{% extends 'base.html' %}

{% block title %}Entrar · Minha Loja{% endblock %}

{% block content %}
<section class="hero py-5">
    <div class="container py-lg-4">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-7 col-lg-5">
                <div class="card border-0 shadow-sm auth-card">
                    <div class="card-body p-4 p-md-5">
                        <div class="icon-circle mx-auto mb-3"><i class="bi bi-person-circle"></i></div>
                        <h1 class="h3 fw-bold text-center mb-1">Entrar</h1>
                        <p class="text-body-secondary text-center mb-4">Acesse sua conta para continuar.</p>

                        <form method="post" novalidate>
                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" name="email"
                                        value="{{ email or '' }}" placeholder="seu@email.com" required autofocus>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="senha" class="form-label">Senha</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="senha" name="senha"
                                        placeholder="Sua senha" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                <i class="bi bi-box-arrow-in-right"></i> Entrar
                            </button>
                        </form>

                        <p class="text-center text-body-secondary mt-4 mb-0">
                            Ainda não tem conta?
                            <a href="{{ url_for('auth.registro') }}" class="text-decoration-none">Cadastre-se</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
