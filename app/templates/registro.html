{% extends 'base.html' %}

{% block title %}Criar conta · Minha Loja{% endblock %}

{% block content %}
<section class="hero py-5">
    <div class="container py-lg-4">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-8 col-lg-6">
                <div class="card border-0 shadow-sm auth-card">
                    <div class="card-body p-4 p-md-5">
                        <div class="icon-circle mx-auto mb-3"><i class="bi bi-person-plus"></i></div>
                        <h1 class="h3 fw-bold text-center mb-1">Criar conta</h1>
                        <p class="text-body-secondary text-center mb-4">Cadastre-se para aproveitar todas as ofertas.</p>

                        <form method="post" novalidate>
                            <div class="mb-3">
                                <label for="nome" class="form-label">Nome completo</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="nome" name="nome"
                                        value="{{ nome or '' }}" placeholder="Seu nome" required autofocus>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" name="email"
                                        value="{{ email or '' }}" placeholder="seu@email.com" required>
                                </div>
                            </div>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="senha" class="form-label">Senha</label>
                                    <input type="password" class="form-control" id="senha" name="senha"
                                        placeholder="Mínimo 6 caracteres" minlength="6" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="confirmacao" class="form-label">Confirmar senha</label>
                                    <input type="password" class="form-control" id="confirmacao" name="confirmacao"
                                        placeholder="Repita a senha" minlength="6" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                <i class="bi bi-check2-circle"></i> Criar conta
                            </button>
                        </form>

                        <p class="text-center text-body-secondary mt-4 mb-0">
                            Já tem uma conta?
                            <a href="{{ url_for('auth.login') }}" class="text-decoration-none">Entrar</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
